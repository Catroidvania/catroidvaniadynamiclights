buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://cdn.fox2code.com/maven' }
    }
    dependencies {
        classpath('com.fox2code.FoxLoader:dev:2.0-alpha15')
    }
}

apply plugin: 'foxloader.dev'

group = 'com.fox2code'
version = '2.0.0'

dependencies {
    api 'org.semver4j:semver4j:5.3.0'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

jar {
    from "LICENSE"
}

//foxloader.decompileSources = false

foxloader {
    modId = "catroidvaniadynamiclights"
    modName = "cats dynamic lights"
    //modIcon = "assets/examplemod/icon.png"
    modVersion = project.version
    modAuthors = "catroidvania"
    modMain = "com.catroidvania.dynamiclights.DynamicLights"
    modDesc("a dynamic lights mod")
}